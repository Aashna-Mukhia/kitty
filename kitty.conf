# Theme
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family DepartureMono Nerd Font
font_size 20.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding
window_margin_width 21.75
window_padding_width 12

# Disable close confirmation
confirm_os_window_close 0

# Shell (macOS default)
shell /bin/zsh

# Enable remote control (REQUIRED)
allow_remote_control yes

# Copy (Mac uses CMD)
map cmd+c copy_or_interrupt

# Search (Mac uses CMD instead of CTRL)
map cmd+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll
map page_up scroll_page_up
map page_down scroll_page_down

# Font zoom (Mac-friendly)
map cmd+plus change_font_size all +1
map cmd+equal change_font_size all +1
map cmd+kp_add change_font_size all +1

map cmd+minus change_font_size all -1
map cmd+underscore change_font_size all -1
map cmd+kp_subtract change_font_size all -1

map cmd+0 change_font_size all 0
map cmd+kp_0 change_font_size all 0


background_image ~/Downloads/wallhaven-kitty.jpg
background_image_layout scaled

# Transparency
background_opacity 0.85
dynamic_background_opacity yes

# Colors (Catppuccin-like)
background            #1e1e2e
foreground            #cdd6f4
cursor                #f5e0dc

color0                #45475a
color1                #f38ba8
color2                #a6e3a1
color3                #f9e2af
color4                #89b4fa
color5                #f5c2e7
color6                #94e2d5
color7                #bac2de
color8                #585b70
color9                #f38ba8
color10               #a6e3a1
color11               #f9e2af
color12               #89b4fa
color13               #f5c2e7
color14               #94e2d5
color15               #a6adc8
